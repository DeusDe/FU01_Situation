<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berichtsheft</title>

    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Eigene Styles (nach Bootstrap, damit sie überschreiben können) -->
    <link href="css/index.css" rel="stylesheet">
</head>
<body data-bs-theme="dark">
    <header class="app-kopf border-bottom">
        <div class="container-fluid d-flex justify-content-between align-items-center py-3">
            <span class="fw-semibold">Berichtsheft</span>
            <a href="seiten/profil.html" class="link-body-emphasis text-decoration-none">Azubi-Profil</a>
        </div>
    </header>

    <div class="container-fluid">
        <div class="row">
            <!-- Woche: mobil horizontale Tagesleiste, ab md linke Sidebar -->
            <aside class="col-12 col-md-3 col-lg-2 woche border-bottom border-md-0 border-end-md py-2 py-md-3">
                <h2 class="h6 text-center fw-bold d-none d-md-block mb-3">Woche</h2>
                <nav id="woche-nav" class="nav nav-pills flex-nowrap flex-md-column overflow-auto" aria-label="Woche"></nav>
            </aside>

            <!-- Tagesansicht / Formular -->
            <main class="col-12 col-md-9 col-lg-10 py-3">
                <div class="d-flex justify-content-between align-items-baseline mb-3">
                    <h1 id="ansicht-titel" class="h6 mb-0"></h1>
                    <span id="stunden-summe" class="small"></span>
                </div>
                <div id="ansicht"></div>
            </main>
        </div>
    </div>

    <!-- Bootstrap JS inkl. Popper (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- Eigenes Script (ES-Module, benötigt einen lokalen Server) -->
    <script type="module" src="skripte/index.js"></script>
</body>
</html>
