<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stundenfehler – Berichtsheft – Lightmode</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="../../css/index.css" rel="stylesheet">
</head>


<body data-bs-theme="light" class="bg-body-tertiary">
<section id="stunden-fehler" aria-label="Fehlerfall: mehr als acht Stunden">

    <div class="berichtsheft min-vh-100 d-flex flex-column">


        <nav class="navbar bg-body border-bottom" aria-label="Hauptnavigation">
            <div class="container-fluid px-3 px-md-4 justify-content-center justify-content-md-between">
                <span class="navbar-brand fw-semibold m-0">Berichtsheft</span>
                <img src="../../assets/image.png" alt="Georg-Simon-Ohm Berufskolleg" class="navbar-logo position-absolute top-50 start-50 translate-middle d-none d-md-block px-2 py-1">
                <span class="nav-link text-body-secondary py-2 d-none d-md-block">Azubi-Profil</span>
            </div>
        </nav>


        <!-- Auf dem Handy ersetzt die Tagesnavigation die seitliche Wochenliste. -->
        <nav class="d-flex d-md-none align-items-center justify-content-between bg-body border-bottom px-2 py-2" aria-label="Statische Tagesübersicht">
            <button type="button" class="btn btn-outline-secondary border-0" aria-label="Vorheriger Arbeitstag">&lsaquo;</button>
            <span class="fw-semibold">Mo. 05.10.2026</span>
            <button type="button" class="btn btn-outline-secondary border-0" aria-label="Nächster Arbeitstag">&rsaquo;</button>
        </nav>


        <div class="container-fluid p-2 p-md-4 d-flex flex-column flex-grow-1">
            <div class="row g-3 flex-grow-1">
                <aside class="col-md-4 col-lg-3 col-xl-2 d-none d-md-block">
                    <section class="card" aria-labelledby="stunden-fehler-woche-titel">
                        <div class="card-header">
                            <h2 id="stunden-fehler-woche-titel" class="h6 mb-1">Woche</h2>
                            <span class="small text-body-secondary">5.–9. Oktober 2026</span>
                        </div>

                        <nav class="list-group list-group-flush wochentage" aria-label="Wochentage">
                        <span class="list-group-item list-group-item-action active" aria-current="date">Mo. 05.10.2026</span>
                        <span class="list-group-item list-group-item-action">Di. 06.10.2026</span>
                        <span class="list-group-item list-group-item-action">Mi. 07.10.2026</span>
                        <span class="list-group-item list-group-item-action">Do. 08.10.2026</span>
                        <span class="list-group-item list-group-item-action">Fr. 09.10.2026</span>
                        </nav>

                    </section>
                </aside>


                <main class="col-12 col-md-8 col-lg-9 col-xl-10 d-flex">
                    <section class="card flex-grow-1" aria-labelledby="stunden-fehler-ansicht-titel">

                        <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2">
                            <div>
                                <h1 id="stunden-fehler-ansicht-titel" class="h5 mb-0 mb-md-1">Neue Tätigkeit</h1>
                                <span class="small text-body-secondary d-none d-md-inline">Montag, 5.10.2026</span>
                            </div>
                            <span class="badge text-bg-secondary" aria-label="0 von 8 Stunden">0/8 h</span>
                        </div>

                        <div class="card-body d-flex flex-column p-3 p-md-4">
                        <div class="formular-entwurf">

                            <div class="mb-3">
                                <label class="form-label" for="stunden-fehler-taetigkeit">Tätigkeit</label>
                                <textarea class="form-control" id="stunden-fehler-taetigkeit" name="taetigkeit" rows="4" placeholder="Beschreibe deine Tätigkeiten" aria-describedby="stunden-fehler-text-fehler" readonly>Berufsschulaufgaben bearbeitet</textarea>
                                <div class="invalid-feedback" id="stunden-fehler-text-fehler">Text fehlt. Ergänze eine Beschreibung.</div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-12 col-md-6 col-lg-3">
                                    <label class="form-label" for="stunden-fehler-stunden">Stunden</label>
                                    <div class="input-group has-validation">
                                        <input class="form-control is-invalid" aria-invalid="true" id="stunden-fehler-stunden" name="stunden" type="number" min="0.5" max="8" step="0.5" value="9" aria-describedby="stunden-fehler-stunden-einheit stunden-fehler-stunden-fehler" readonly>
                                        <span class="input-group-text" id="stunden-fehler-stunden-einheit">h</span>
                                        <div class="invalid-feedback" id="stunden-fehler-stunden-fehler">Gib 0,5 bis 8 Stunden ein. Maximal 8 Stunden am Tag.</div>
                                    </div>
                                </div>
                            </div>

                            <div class="d-grid gap-2 d-sm-flex">
                                <button class="btn btn-primary" type="button">Speichern</button>
                                <button type="button" class="btn btn-outline-secondary">Abbrechen</button>
                            </div>

                        </div>
                        </div>
                    </section>
                </main>


            </div>
            <span class="d-md-none text-center small text-body-secondary mt-3">Azubi-Profil</span>
        </div>
    </div>

</section>
</body>
</html>
