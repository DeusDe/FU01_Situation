<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nachweise werden geladen … – Ausbilder</title>
  <link rel="stylesheet" href="../vendor/bootstrap.min.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header>
    <nav class="navbar bg-body-tertiary border-bottom">
      <div class="container">
        <a class="navbar-brand" href="../index.html">Berichtsheft-App</a>
        <span class="navbar-text">Ausbilder-Ansicht · K. Tari</span>
      </div>
    </nav>
  </header>

  <main class="container py-4">
    <h1 class="h4 mb-3">Offene Ausbildungsnachweise</h1>

    <!-- Lade-Zustand: kurze Rückmeldung, DASS geladen wird (role=status), + Skeleton-Platzhalter
         für die noch nicht geladene Liste. Rein statisch, ohne JavaScript. -->
    <div class="d-flex align-items-center gap-2 mb-3 text-muted" role="status">
      <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
      <span>Nachweise werden geladen …</span>
    </div>

    <!-- Skeleton: Platzhalter-Zeilen (Bootstrap .placeholder). aria-hidden, da reine Optik. -->
    <div class="list-group placeholder-glow" aria-hidden="true">
      <div class="list-group-item">
        <div class="d-flex w-100 justify-content-between align-items-center">
          <span class="placeholder col-5"></span><span class="placeholder col-3"></span>
        </div>
        <span class="placeholder col-8 mt-2"></span>
      </div>
      <div class="list-group-item">
        <div class="d-flex w-100 justify-content-between align-items-center">
          <span class="placeholder col-6"></span><span class="placeholder col-3"></span>
        </div>
        <span class="placeholder col-7 mt-2"></span>
      </div>
      <div class="list-group-item">
        <div class="d-flex w-100 justify-content-between align-items-center">
          <span class="placeholder col-4"></span><span class="placeholder col-3"></span>
        </div>
        <span class="placeholder col-8 mt-2"></span>
      </div>
      <div class="list-group-item">
        <div class="d-flex w-100 justify-content-between align-items-center">
          <span class="placeholder col-5"></span><span class="placeholder col-3"></span>
        </div>
        <span class="placeholder col-6 mt-2"></span>
      </div>
    </div>
  </main>

  <footer class="container py-4 text-muted border-top">
    <small>Fallstudie · Zustand: Laden (Skeleton)</small>
  </footer>
</body>
</html>
